<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#153c32">
  <title>Vedant Pure Veg Menu</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-synthesis: none; text-rendering: optimizeLegibility; --green: #174735; --deep-green: #10382a; --leaf: #2f7654; --gold: #c69a4e; --cream: #f6f3e9; --ink: #20392f; --muted: #6b786f; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; scroll-behavior: smooth; }
    body { background: var(--cream); color: var(--ink); }
    .site-header { position: sticky; top: 0; z-index: 5; background: linear-gradient(110deg, var(--deep-green), #1e5940); color: #fff; box-shadow: 0 4px 18px #173d2b22; }
    .header-inner { width: min(100% - 2rem, 1120px); min-height: 76px; margin: auto; display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .brand { display: inline-flex; align-items: center; gap: .8rem; color: inherit; text-decoration: none; }
    .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border: 1px solid #d1ac6c99; border-radius: 50%; color: #e1c38a; }
    .brand-mark svg { width: 22px; height: 22px; }
    .brand-copy { display: grid; gap: .1rem; }
    .brand-copy strong { font-size: 1.03rem; letter-spacing: .15em; line-height: 1.1; }
    .brand-copy small { color: #d3dfd5; font-size: .62rem; font-weight: 600; letter-spacing: .19em; }
    .header-tag { display: inline-flex; align-items: center; gap: .45rem; color: #e5d5b3; font-size: .72rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
    .header-tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #9fc37a; box-shadow: 0 0 0 4px #9fc37a22; }
    .viewer-shell { width: min(100% - 2rem, 1120px); margin: 0 auto; padding: 42px 0 56px; }
    .intro { position: relative; padding: 0 0 26px; }
    .eyebrow { display: flex; align-items: center; gap: .55rem; color: var(--leaf); font-size: .69rem; font-weight: 750; letter-spacing: .18em; text-transform: uppercase; }
    .eyebrow::before { content: ""; display: inline-block; width: 22px; height: 1px; background: var(--gold); }
    h1 { margin: 13px 0 8px; color: var(--deep-green); font-family: Georgia, "Times New Roman", serif; font-size: clamp(2rem, 4vw, 3rem); font-weight: 500; letter-spacing: -.035em; line-height: 1.08; }
    h1 em { color: var(--leaf); font-weight: 500; }
    .intro p { margin: 0; color: var(--muted); font-size: .97rem; }
    .viewer-toolbar { position: sticky; top: 76px; z-index: 4; display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 62px; padding: .65rem .85rem .65rem 1rem; border: 1px solid #d8ddcf; border-radius: 13px; background: #fffdfaeb; box-shadow: 0 7px 22px #20392f0c; backdrop-filter: blur(12px); }
    .toolbar-label { display: flex; align-items: center; gap: .55rem; color: var(--ink); font-size: .88rem; font-weight: 650; }
    .toolbar-label small { color: var(--muted); font-size: .78rem; font-weight: 500; }
    .page-count { min-width: 66px; padding: .4rem .55rem; border: 1px solid #e5e7de; border-radius: 8px; background: #f7f7f1; color: var(--green); font-variant-numeric: tabular-nums; text-align: center; }
    .actions { display: flex; align-items: center; gap: .4rem; }
    button { display: grid; width: 40px; height: 40px; place-items: center; border: 1px solid #d4dccf; border-radius: 9px; background: #fff; color: var(--green); font: 600 1.2rem/1 system-ui, sans-serif; cursor: pointer; transition: background .15s ease, border-color .15s ease, transform .15s ease; }
    button:hover:not(:disabled) { transform: translateY(-1px); border-color: #91ad95; background: #f0f5ee; }
    button:focus-visible { outline: 3px solid #c69a4e88; outline-offset: 2px; }
    button:disabled { color: #aab4a9; cursor: default; }
    #status { margin: 15px auto 0; padding: 15px 18px; border: 1px solid #e5dfcc; border-radius: 10px; background: #fffaf0; color: #6d5a35; text-align: center; }
    #status[hidden] { display: none; }
    #status a { color: var(--green); font-weight: 650; }
    #pages { width: min(100%, 1020px); margin: 18px auto 0; padding: 0 16px; }
    .page { width: 100%; margin: 0 auto 22px; overflow: hidden; border: 1px solid #e5e1d5; border-radius: 10px; background: #fff; box-shadow: 0 12px 34px #283d2d16, 0 2px 5px #283d2d0a; scroll-margin-top: 158px; }
    .page canvas { display: block; width: 100%; height: auto; }
    .page.is-loading { display: grid; place-items: center; background: #fffdf8; }
    .page-placeholder { display: grid; justify-items: center; gap: .7rem; color: #778277; font-size: .82rem; }
    .loading-spinner { width: 25px; height: 25px; border: 2px solid #dce5d9; border-top-color: var(--leaf); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .site-footer { padding: 20px 1rem max(24px, env(safe-area-inset-bottom)); color: #78847a; font-size: .75rem; text-align: center; }
    .site-footer span { color: var(--gold); }
    @media (max-width: 640px) {
      .header-inner { width: calc(100% - 1.25rem); min-height: 66px; }
      .brand { gap: .6rem; }
      .brand-mark { width: 37px; height: 37px; }
      .brand-copy strong { font-size: .94rem; }
      .brand-copy small { font-size: .56rem; }
      .header-tag { font-size: .58rem; letter-spacing: .08em; }
      .viewer-shell { width: calc(100% - 1.25rem); padding: 29px 0 38px; }
      .intro { padding-bottom: 20px; }
      h1 { margin-top: 11px; font-size: clamp(1.8rem, 8vw, 2.45rem); }
      .intro p { font-size: .88rem; }
      .viewer-toolbar { top: 66px; min-height: 57px; gap: .5rem; padding: .5rem .55rem .5rem .7rem; border-radius: 11px; }
      .toolbar-label { gap: .35rem; font-size: .78rem; }
      .toolbar-label small { display: none; }
      .page-count { min-width: 57px; padding: .35rem .4rem; font-size: .78rem; }
      .actions { gap: .3rem; }
      button { width: 37px; height: 37px; border-radius: 8px; }
      #pages { margin-top: 12px; padding: 0; }
      .page { margin-bottom: 14px; border-radius: 7px; scroll-margin-top: 137px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html, body { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./" aria-label="Vedant Pure Veg home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20.7 3.3C12.5 3.1 6.2 5.1 4 10.5c-1.2 2.9.1 5.7 2.8 6.3 5.1 1.1 10.5-4.1 13.9-13.5Z"/><path d="M3 21c2.8-6.4 7.1-10.4 12.8-13.5"/></svg>
        </span>
        <span class="brand-copy"><strong>VEDANT</strong><small>PURE VEGETARIAN</small></span>
      </a>
      <span class="header-tag">Fresh · Pure · Vegetarian</span>
    </div>
  </header>
  <main class="viewer-shell">
    <section class="intro" aria-labelledby="page-title">
      <div class="eyebrow">A taste of Ambegaon</div>
      <h1 id="page-title">Explore our <em>menu.</em></h1>
      <p>Find something delicious to enjoy.</p>
    </section>
    <section class="viewer-toolbar" aria-label="Menu page controls">
      <div class="toolbar-label">Menu catalogue <small>·</small><span id="page-count" class="page-count" aria-live="polite">…</span></div>
      <div class="actions">
        <button id="prev" type="button" aria-label="Previous page" title="Previous page" disabled>←</button>
        <button id="next" type="button" aria-label="Next page" title="Next page" disabled>→</button>
      </div>
    </section>
    <div id="status" role="status">Loading menu…</div>
    <div id="pages" aria-label="Menu pages"></div>
  </main>
  <footer class="site-footer">Made with care <span>♥</span> Vedant Pure Veg</footer>
  <script type="module">
    const PDF_URL = "./VEDANT%20PURE%20VEG.pdf";
    const PDFJS_VERSION = "6.4.299";
    const status = document.querySelector("#status");
    const pages = document.querySelector("#pages");
    const count = document.querySelector("#page-count");
    const previous = document.querySelector("#prev");
    const next = document.querySelector("#next");
    let currentPage = 1;
    let pageNodes = [];
    let pdfDocument;

    function syncControls() {
      count.textContent = pageNodes.length ? currentPage + " / " + pageNodes.length : "—";
      previous.disabled = currentPage <= 1;
      next.disabled = currentPage >= pageNodes.length;
    }

    async function renderPage(number) {
      const shell = pageNodes[number - 1];
      if (!shell || shell.dataset.rendered || shell.dataset.rendering) return;
      shell.dataset.rendering = "true";
      try {
        const page = await pdfDocument.getPage(number);
        const base = page.getViewport({ scale: 1 });
        const width = Math.min(pages.clientWidth, 900);
        const viewport = page.getViewport({ scale: width / base.width });
        const ratio = Math.min(window.devicePixelRatio || 1, 2);
        const canvas = document.createElement("canvas");
        canvas.width = Math.floor(viewport.width * ratio);
        canvas.height = Math.floor(viewport.height * ratio);
        canvas.style.width = "100%";
        const context = canvas.getContext("2d", { alpha: false });
        await page.render({ canvas, canvasContext: context, viewport, transform: ratio === 1 ? null : [ratio, 0, 0, ratio, 0, 0] }).promise;
        shell.replaceChildren(canvas);
        shell.style.removeProperty("aspect-ratio");
        shell.classList.remove("is-loading");
        shell.dataset.rendered = "true";
        delete shell.dataset.rendering;
        page.cleanup();
      } catch (error) {
        console.error("Unable to render menu page " + number, error);
        shell.classList.remove("is-loading");
        shell.innerHTML = '<div class="page-placeholder">This page could not be rendered.</div>';
        delete shell.dataset.rendering;
      }
    }

    function goToPage(number) {
      currentPage = Math.max(1, Math.min(pageNodes.length, number));
      pageNodes[currentPage - 1]?.scrollIntoView({ behavior: "smooth", block: "start" });
      syncControls();
      renderPage(currentPage);
    }

    previous.addEventListener("click", () => goToPage(currentPage - 1));
    next.addEventListener("click", () => goToPage(currentPage + 1));

    try {
      const pdfjs = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.mjs");
      pdfjs.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@" + PDFJS_VERSION + "/build/pdf.worker.mjs";
      pdfDocument = await pdfjs.getDocument({ url: PDF_URL }).promise;

      for (let number = 1; number <= pdfDocument.numPages; number++) {
        const shell = document.createElement("section");
        shell.className = "page is-loading";
        shell.id = "page-" + number;
        shell.style.aspectRatio = "0.71";
        shell.setAttribute("aria-label", "Page " + number + " of " + pdfDocument.numPages);
        shell.innerHTML = '<div class="page-placeholder"><span class="loading-spinner" aria-hidden="true"></span><span>Loading page ' + number + '</span></div>';
        pageNodes.push(shell);
        pages.append(shell);
      }

      const renderObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) {
          const index = pageNodes.indexOf(entry.target);
          if (index >= 0) renderPage(index + 1);
        }
      }, { rootMargin: "1000px 0px" });
      const pageObserver = new IntersectionObserver((entries) => {
        for (const entry of entries) if (entry.isIntersecting) {
          const index = pageNodes.indexOf(entry.target);
          if (index >= 0) { currentPage = index + 1; syncControls(); }
        }
      }, { rootMargin: "-20% 0px -65% 0px" });
      pageNodes.forEach((node) => { renderObserver.observe(node); pageObserver.observe(node); });

      syncControls();
      await renderPage(1);
      status.hidden = true;
    } catch (error) {
      console.error("Unable to display menu PDF", error);
      status.textContent = "The menu could not be displayed. Use the link below to open the PDF.";
      status.insertAdjacentHTML("beforeend", ' <a href="' + PDF_URL + '">Open PDF</a>');
    }
  </script>
</body>
</html>
